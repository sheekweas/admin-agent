# Scrape job for Prometheus running in the same docker host (attach it to the compose "edge" network)
# or remotely through an SSH tunnel / VPN. With METRICS_TOKEN set, pass it as a bearer token.
scrape_configs:
  - job_name: ai-crm-api
    metrics_path: /metrics
    scrape_interval: 30s
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/ai-crm-metrics-token   # contents = METRICS_TOKEN
    static_configs:
      - targets: ["api:8000"]
rule_files:
  - /etc/prometheus/prometheus-alerts.yml
