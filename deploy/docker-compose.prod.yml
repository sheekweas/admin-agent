# Production stack (standalone). Run from the repository root:
#
#   docker compose --env-file deploy/.env.production -f deploy/docker-compose.prod.yml up -d --build
#
# Public entry point is Caddy only (80/443, automatic HTTPS for API_DOMAIN and APP_DOMAIN).
# PostgreSQL and Redis publish no ports and sit on an internal network without internet egress.
# Migrations run once in the `migrate` service before api/worker/beat start.
# See docs/OPERATIONS.md for upgrade, rollback, backups and monitoring.

name: ${COMPOSE_PROJECT_NAME:-ai-crm-prod}

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-backend: &backend
  image: ${BACKEND_IMAGE:-ai-crm/backend:1.0.0}
  build:
    context: ../backend
  env_file: ["${APP_ENV_FILE:-.env.production}"]
  environment: &backend-env
    ENV: production
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-crm}
    REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  depends_on: &backend-deps
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  logging: *logging
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  networks: [data, edge]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
    command: ["postgres", "-c", "max_connections=${PG_MAX_CONNECTIONS:-200}", "-c", "shared_buffers=${PG_SHARED_BUFFERS:-256MB}"]
    volumes: [pgdata:/var/lib/postgresql/data]
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "2", memory: 2g}
    networks: [data]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 384m}
    networks: [data]

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    healthcheck:
      disable: true
    deploy:
      resources:
        limits: {cpus: "1", memory: 512m}
    networks: [data]

  api:
    <<: *backend
    # One uvicorn process per container (Prometheus counters are per process); scale with replicas.
    # Proxy headers are trusted only from the edge network (Caddy) so client IPs reach rate limits / audit.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "${EDGE_SUBNET:-172.30.10.0/24}", "--no-server-header"]
    depends_on:
      <<: *backend-deps
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits: {cpus: "2", memory: 1g}

  worker:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "--concurrency=${WORKER_CONCURRENCY:-4}", "--hostname=worker@%h"]
    depends_on:
      <<: *backend-deps
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --destination worker@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits: {cpus: "2", memory: 1g}

  beat:
    <<: *backend
    # Exactly ONE beat per deployment (it is the scheduler); never scale it.
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/beat/celerybeat-schedule", "--pidfile="]
    depends_on:
      <<: *backend-deps
      migrate:
        condition: service_completed_successfully
    tmpfs: ["/tmp/beat:uid=1000,gid=1000"]
    healthcheck:
      # beat process alive + broker reachable; a stalled scheduler shows up as CrmOutboxBacklog (outbox age)
      test: ["CMD", "python", "-c", "import os,sys,redis; ok=b'beat' in open('/proc/1/cmdline','rb').read() and redis.Redis.from_url(os.environ['REDIS_URL'], socket_timeout=3).ping(); sys.exit(0 if ok else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 384m}

  frontend:
    image: ${FRONTEND_IMAGE:-ai-crm/frontend:1.0.0}
    build:
      context: ../frontend
      args:
        # baked into the browser bundle at build time: rebuild the image when the API domain changes
        NEXT_PUBLIC_API_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: {cpus: "1", memory: 512m}
    networks: [edge]

  caddy:
    image: caddy:2.10-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    deploy:
      resources:
        limits: {cpus: "1", memory: 256m}
    networks: [edge]

  backup:
    image: ${BACKUP_IMAGE:-ai-crm/backup:1.0.0}
    build:
      context: ./backup
    env_file: ["${APP_ENV_FILE:-.env.production}"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-crm}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-crm}
      BACKUP_DIR: /backups
    volumes:
      - ${BACKUP_HOST_DIR:-backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/backup-health.sh"]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 2m
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: {cpus: "1", memory: 512m}
    networks: [data, egress]

networks:
  # postgres/redis: no published ports, no internet
  data:
    internal: true
  # Caddy <-> api/frontend; api/worker/beat reach providers (Meta, Telegram, Twilio, Anthropic) through it
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.30.10.0/24}
  # backup -> S3-compatible storage
  egress: {}

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
  backups:
