[project]
name = "ai-crm"
version = "1.0.0"
description = "AI CRM for service businesses: WhatsApp AI agent, booking engine, CRM, Telegram escalation, analytics"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pyjwt>=2.10",
    "httpx>=0.28",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "anthropic>=0.75",
    "phonenumbers>=8.13",
    "python-multipart>=0.0.18",
    "openpyxl>=3.1",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8", "openapi-spec-validator>=0.7"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
pycodestyle.max-line-length = 120  # long RU/KK message templates
select = ["E", "F", "W", "B", "UP", "BLE", "RUF", "FURB"]
# RUF001-003: Cyrillic text is intentional (RU/KK). UP042: (str, Enum) kept for SQLAlchemy/pydantic interop.
ignore = ["RUF001", "RUF002", "RUF003", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # long literal webhook payloads / dialog fixtures

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection idiom: Depends()/Query()/Header() in argument defaults
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Body", "fastapi.Path", "app.deps.require",
]
